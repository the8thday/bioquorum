name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest --cov=bioquorum --cov-report=term-missing
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json
      - run: uv sync --locked
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - name: Rebuild and compare the packaged workbench
        run: |
          npm run build --prefix web -- --outDir "$RUNNER_TEMP/workbench" --emptyOutDir
          diff -ru src/bioquorum/server/web "$RUNNER_TEMP/workbench"
      - run: npm ci --prefix tests/e2e --ignore-scripts
      - run: npm test --prefix tests/e2e
      - run: BQ_TEST_TASKS=1 npm test --prefix tests/e2e
      - run: BQ_TEST_CONVERSATION=1 npm test --prefix tests/e2e
      - run: BQ_TEST_PROJECTS=1 npm test --prefix tests/e2e
      - run: BQ_TEST_EXTENSIONS=1 npm test --prefix tests/e2e
      - run: BQ_TEST_LAYOUT=1 npm test --prefix tests/e2e
      - run: BQ_TEST_FIRST_RUN=1 npm test --prefix tests/e2e
      - run: BQ_TEST_UPLOAD=1 npm test --prefix tests/e2e
      - run: BQ_TEST_VIEWERS=1 npm test --prefix tests/e2e
      - run: BQ_TEST_MATERIALS=1 npm test --prefix tests/e2e
      - run: BQ_TEST_SCENARIO_D=1 npm test --prefix tests/e2e
      - name: Prepare and verify the HER2 research example
        run: |
          export BQ_TEST_REAL_PROJECT="$RUNNER_TEMP/her2-project"
          uv run --locked python examples/v11/prepare.py --project "$BQ_TEST_REAL_PROJECT"
          BQ_TEST_HER2=1 npm test --prefix tests/e2e
      - run: BQ_TEST_COVERAGE=1 npm test --prefix tests/e2e
      - run: BQ_TEST_BILINGUAL=1 npm test --prefix tests/e2e
      - run: BQ_TEST_REFERENCES=1 npm test --prefix tests/e2e
      - run: BQ_TEST_PROJECT_NOTE=1 npm test --prefix tests/e2e
      - run: uv build --wheel
      - run: |
          wheels=(dist/*.whl)
          uvx --from "${wheels[0]}" bioquorum --help
