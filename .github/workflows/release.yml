name: release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified artifacts to PyPI
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked --all-groups
      - run: uv run pytest
      - run: uv run lint-imports
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv build
      - run: python scripts/check_distributions.py dist
      - run: |
          wheels=(dist/*.whl)
          python scripts/smoke_workbench.py uvx --from "$PWD/${wheels[0]}" bioquorum
      - name: Verify the requested publication tag
        if: inputs.publish
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_distributions.py dist --tag "$RELEASE_TAG"
      - name: Build and smoke-test the local Docker image
        run: |
          docker build -t bioquorum:candidate .
          docker run --rm bioquorum:candidate --help
          set -o pipefail
          docker save bioquorum:candidate | gzip > "$RUNNER_TEMP/bioquorum-image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: bioquorum-docker-image
          path: ${{ runner.temp }}/bioquorum-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bioquorum-distributions
          path: dist/
  publish:
    needs: build
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bioquorum-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
