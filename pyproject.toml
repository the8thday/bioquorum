[project]
name = "bioquorum"
version = "0.1.0"
description = "Open, model-neutral AI workbench for biomedical research: cross-verified, reproducible, private by design."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "BioQuorum contributors" }]
dependencies = [
  "pydantic>=2.9,<3",
  "python-ulid>=3.0,<4",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12",
  "rich>=13",
  "jupyter_client>=8.6,<9",  # Kernel protocol, runtime/ only (ADR-009)
  "ipykernel>=6.29",          # default Python kernel until pixi envs (ROADMAP v0.2)
  "mcp>=2.3,<3",               # official MCP SDK, mcp/ only (ARCHITECTURE.md §4)
  "pydantic-ai-slim[openai]>=2.68,<3",  # models/ only (ADR-003); slim: no telemetry deps
  "httpx2>=2.16,<3",           # download_file (tools/); already pulled in by mcp and pydantic-ai
]

[project.optional-dependencies]
hashing = ["pandas>=2.2", "pyarrow>=16"]
eval = ["anthropic>=0.40", "openai>=1.50", "pyyaml>=6"]

[project.scripts]
bq = "bioquorum.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioquorum"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "import-linter>=2.0",
  "pre-commit>=3.8",
  "pyyaml>=6",
  "pandas>=2.2",
  "pyarrow>=16",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "TID", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bioquorum"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration and not live and not e2e'"
markers = [
  "integration: needs a real Jupyter kernel or local services",
  "live: calls real external APIs (databases); run nightly",
  "e2e: full scenario runs",
]

# ---------------------------------------------------------------- import-linter
# ARCHITECTURE.md §2. Any change here requires a new ADR.
[tool.importlinter]
root_package = "bioquorum"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (ARCHITECTURE.md §2)"
type = "layers"
layers = [
  "bioquorum.server | bioquorum.cli",
  "bioquorum.agent",
  "bioquorum.review",
  "bioquorum.models",
  "bioquorum.tools",
  "bioquorum.runtime | bioquorum.provenance | bioquorum.connectors | bioquorum.skills | bioquorum.mcp",
  "bioquorum.policy | bioquorum.storage",
  "bioquorum.core",
]

[[tool.importlinter.contracts]]
name = "Science layer must not import agent layer (ADR-001, principle 1)"
type = "forbidden"
source_modules = [
  "bioquorum.tools", "bioquorum.runtime", "bioquorum.provenance",
  "bioquorum.connectors", "bioquorum.skills", "bioquorum.mcp",
  "bioquorum.policy", "bioquorum.storage", "bioquorum.core",
]
forbidden_modules = [
  "bioquorum.agent", "bioquorum.review", "bioquorum.models",
  "bioquorum.server", "bioquorum.cli",
]

[[tool.importlinter.contracts]]
name = "core has no heavy dependencies (ADR-003)"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["bioquorum.core"]
forbidden_modules = [
  "pydantic_ai", "sqlalchemy", "fastapi", "jupyter_client", "anthropic", "openai",
  "pandas", "anndata", "numpy", "typer", "rich",
]

[[tool.importlinter.contracts]]
name = "pydantic_ai and provider SDKs only inside models/ (ADR-003)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "bioquorum.core", "bioquorum.storage", "bioquorum.policy", "bioquorum.runtime",
  "bioquorum.provenance", "bioquorum.connectors", "bioquorum.skills", "bioquorum.mcp",
  "bioquorum.tools", "bioquorum.review", "bioquorum.agent", "bioquorum.server", "bioquorum.cli",
]
forbidden_modules = ["pydantic_ai", "openai", "anthropic"]  # provider SDKs too

[[tool.importlinter.contracts]]
name = "sqlalchemy only inside storage/ (ARCHITECTURE.md §2)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "bioquorum.core", "bioquorum.policy", "bioquorum.runtime", "bioquorum.provenance",
  "bioquorum.connectors", "bioquorum.skills", "bioquorum.mcp", "bioquorum.tools",
  "bioquorum.models", "bioquorum.review", "bioquorum.agent", "bioquorum.server", "bioquorum.cli",
]
forbidden_modules = ["sqlalchemy"]

[[tool.importlinter.contracts]]
name = "jupyter_client only inside runtime/ (ADR-009)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "bioquorum.core", "bioquorum.storage", "bioquorum.policy", "bioquorum.provenance",
  "bioquorum.connectors", "bioquorum.skills", "bioquorum.mcp", "bioquorum.tools",
  "bioquorum.models", "bioquorum.review", "bioquorum.agent", "bioquorum.server", "bioquorum.cli",
]
forbidden_modules = ["jupyter_client"]

[[tool.importlinter.contracts]]
name = "Agent layer reaches runtime/connectors/mcp only via tools.invoke() (ADR-006)"
type = "forbidden"
allow_indirect_imports = true  # agent -> tools -> runtime is the intended path
source_modules = ["bioquorum.agent", "bioquorum.review", "bioquorum.models"]
forbidden_modules = ["bioquorum.runtime", "bioquorum.connectors", "bioquorum.mcp"]

[[tool.importlinter.contracts]]
name = "MCP SDK only inside mcp/ (ARCHITECTURE.md §4, §6.4)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "bioquorum.core", "bioquorum.storage", "bioquorum.policy", "bioquorum.runtime",
  "bioquorum.provenance", "bioquorum.connectors", "bioquorum.skills", "bioquorum.tools",
  "bioquorum.models", "bioquorum.review", "bioquorum.agent", "bioquorum.server", "bioquorum.cli",
]
forbidden_modules = ["mcp", "mcp_types"]
