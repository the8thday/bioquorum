  split: development
  question: Review aspirin for primary prevention in older adults.
  criteria:
    population: Distinguish primary from secondary prevention.
    benefit: Report an outcome from a controlled trial in older adults.
    harm: Compare bleeding outcomes over the same study window.
- id: q-C-09
  split: development
  question: Does vitamin D supplementation reduce fractures in community-dwelling adults?
  criteria:
    population: Describe baseline deficiency or eligibility in the studies.
    endpoint: Use fracture outcomes from an intervention study.
    cointervention: Distinguish vitamin D alone from calcium coadministration.
