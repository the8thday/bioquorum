    text: "Statin use prevents Alzheimer's disease; in almost 400,000 older adults, high cumulative exposure lowered Alzheimer's incidence by 19% (HR 0.81) [c1]."
    kind: causal
  - index: 2
    text: "A Mendelian randomisation study using HMGCR variants likewise found that genetically lower HMG-CoA reductase activity was associated with reduced Alzheimer's risk [c4]."
    kind: citation
  - index: 3
    text: "Simvastatin at 1 microM lowered secreted amyloid-beta 40 by 53% and amyloid-beta 42 by 28% in human iPSC-derived neurons, and mevalonate reversed the effect [c3]."
    kind: citation
  - index: 4
    text: "It is uncertain whether clinical doses achieve sufficient brain exposure for this mechanism to operate [c3]."
    kind: citation
  - index: 5
    text: "A pooled analysis of 26,340 trial participants aged 70 to 82 found no difference in cognitive decline between statin and placebo over 3.2 to 5 years [c2]."
    kind: citation
  - index: 6
    text: "Dementia was not a primary endpoint in those trials [c2]."
    kind: citation
injected_errors:
  - claim_index: 1
    type: overclaim_causal
    description: c1 is an observational claims cohort reporting an association and warning of healthy-user bias and reverse causation; it does not show that statins prevent Alzheimer's disease.
  - claim_index: 2
    type: fabricated_citation
    description: The answer cites [c4], but evidence contains only c1-c3; no provided source is a Mendelian randomisation study.
  - claim_index: 3
    type: value_mismatch
    description: c3 reports a 35% reduction in secreted amyloid-beta 40, not 53%.
