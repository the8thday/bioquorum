    type: execution_unsupported
    description: The only ClinicalTrials.gov run (r2) failed with an UpstreamTimeout, so no trial counts or phase breakdown were obtained.
  - claim_index: 7
    type: plan_incomplete
    description: The approved plan includes a gnomAD constraint and loss-of-function safety check, but no run or statement addresses it while the answer implies the dossier is complete.
