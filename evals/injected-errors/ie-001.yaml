injected_errors:
  - claim_index: 2
    type: value_mismatch
    description: The answer reports an odds ratio of 0.24 for R381Q, but run r2 stdout shows odds_ratio 0.42.
  - claim_index: 5
    type: citation_unsupported
    description: c1 is a mouse T-cell transfer colitis study; it reports no data in patients, so the claim of reduced inflammation in patients is unsupported.
