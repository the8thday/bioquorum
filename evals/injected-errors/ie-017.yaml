injected_errors:
  - claim_index: 3
    type: fabricated_citation
    description: c2 is a renal haemodynamics study (GFR and plasma volume) and says nothing about myocardial ketone utilisation or ATP; the ketone finding comes from pigs in c3.
  - claim_index: 6
    type: plan_incomplete
    description: The approved plan requires safety evidence on euglycaemic ketoacidosis and genital mycotic infections, which the answer never addresses while claiming safety is covered.
