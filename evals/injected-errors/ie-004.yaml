injected_errors:
  - claim_index: 3
    type: value_mismatch
    description: The 2.4-fold change in run r2 is for UC; Crohn's disease shows only 1.3-fold, so the answer swaps the two disease groups.
  - claim_index: 5
    type: overclaim_causal
    description: The only supporting evidence is a cross-sectional Spearman correlation (rho 0.46), which cannot show that TL1A drives severity.
