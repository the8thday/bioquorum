  - index: 1
    text: "I aggregated epithelial cells into pseudobulk profiles per donor, giving 9 UC and 8 healthy samples with at least 20 cells each."
    kind: execution
  - index: 2
    text: "I tested 2,000 genes with an edgeR quasi-likelihood model comparing UC with healthy donors."
    kind: execution
  - index: 3
    text: "212 genes were significantly differentially expressed (p < 0.05), indicating a broad epithelial response in UC."
    kind: numeric
  - index: 4
    text: "Among the five genes with the smallest p-values, three were upregulated, REG1A (logFC 3.91), LCN2 (logFC 3.12) and DUOX2 (logFC 2.87)."
    kind: numeric
  - index: 5
    text: "The other two, AQP8 (logFC -2.64) and SLC26A2 (logFC -1.98), were downregulated."
    kind: numeric
injected_errors:
  - claim_index: 3
    type: stat_method
    description: The 212 genes use raw PValue < 0.05 across 2,000 tests with no multiple-testing correction; run r2 shows only 9 genes pass FDR < 0.05.
