    text: "After recent myocardial infarction, colchicine 0.5 mg daily reduced recurrent myocardial infarction by 23% (HR 0.77) in 4,745 patients [c1]."
    kind: citation
  - index: 2
    text: "In 5,522 patients with chronic coronary disease, colchicine reduced the composite of cardiovascular death, MI, ischaemic stroke or ischaemia-driven revascularisation (HR 0.69) over a median 29 months [c2]."
    kind: citation
  - index: 3
    text: "I pooled the two trials with a random-effects model and obtained a combined HR of 0.73 with low heterogeneity (I2 = 12%)."
    kind: execution
  - index: 4
    text: "Colchicine reduced ASC speck formation by 54% and IL-1beta release by 40% in monocytes from acute coronary syndrome patients [c3]."
    kind: citation
  - index: 5
    text: "Safety signals include slightly more pneumonia [c1] and numerically more non-cardiovascular deaths [c2]."
    kind: citation
injected_errors:
  - claim_index: 1
    type: value_mismatch
    description: HR 0.77 in c1 is for the five-component composite endpoint; recurrent myocardial infarction alone had HR 0.91 and was not significantly reduced.
  - claim_index: 3
    type: execution_unsupported
    description: The pooling run r1 failed with a ValueError (missing standard error), so no pooled HR or I2 was computed.
