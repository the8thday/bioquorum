  - claim_index: 2
    type: plan_incomplete
    description: The approved plan requires Harmony integration, but run r2 builds neighbours directly on PCA with no Harmony step, while the answer claims integration was done.
  - claim_index: 4
    type: value_mismatch
    description: Run r2 shows CD4 T cells at 34.2% and CD14 monocytes at 21.7%; the answer swaps the two labels.
